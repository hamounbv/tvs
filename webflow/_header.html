<!-- ============================================================
     TVS Animal Hospital — Site Settings → Custom Code → HEAD
     Version-controlled source of truth for the head block. Paste its
     contents into Webflow Site Settings, replacing what is there now.

     Changes vs the previous head:
     - duplicate viewport meta (maximum-scale=1) removed — it disabled
       pinch-zoom (accessibility fail, flagged by Lighthouse). Webflow
       already emits a correct viewport tag. Keep form inputs at >=16px
       to stop iOS zooming on focus.
     - flatpickr CSS pinned to 4.6.13. The old URL had no version at all,
       so the site silently tracked whatever npm's latest was — verified
       today it resolves to 4.6.13, so this pin freezes current behaviour.
     - site CSS added from the pinned jsDelivr build.
       NOTE: this stylesheet is linked TWICE on purpose — here, and again
       in webflow/_embed.html. The head copy is what production needs; the
       embed copy is what makes the styles visible on the Designer canvas,
       which does not execute head custom code. Same URL both times, so the
       browser fetches it once. Do not "fix" this by deleting one.
     Remember to bump @1.0.0 when you tag a new release.
     ============================================================ -->

<style>
  /* Hiding Dev Supports */
  .g-embed-code,
  /* .g-grid-guide, */
  .w-webflow-badge {
    z-index: -99999 !important;
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
  }

  /* --------- Lenis Smooth Scrolling --------- */
  html.lenis {
    height: auto;
  }
  .lenis.lenis-smooth {
    scroll-behavior: auto !important;
  }
  .lenis.lenis-smooth [data-lenis-prevent] {
    overscroll-behavior: contain;
  }
  .lenis.lenis-stopped {
    overflow: hidden;
  }
</style>
